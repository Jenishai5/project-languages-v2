<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" xmlns:c2pa="http://c2pa.org/manifest"><defs>
  <filter id="felt" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G" result="fuzzy"/>
    <feGaussianBlur in="fuzzy" stdDeviation="5" result="blur"/>
    <feDiffuseLighting in="blur" surfaceScale="5" lighting-color="#ffffff" result="puff">
      <feDistantLight azimuth="235" elevation="52"/>
    </feDiffuseLighting>
    <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="3" seed="9" result="g"/>
    <feDiffuseLighting in="g" surfaceScale="0.9" lighting-color="#ffffff" result="grain">
      <feDistantLight azimuth="235" elevation="62"/>
    </feDiffuseLighting>
    <feComposite in="puff" in2="fuzzy" operator="arithmetic" k1="1.22" k2="0" k3="0" k4="0" result="p"/>
    <feComposite in="grain" in2="p" operator="arithmetic" k1="1.1" k2="0" k3="0" k4="0" result="lit"/>
    <feComposite in="lit" in2="fuzzy" operator="in"/>
  </filter>
