openapi: 3.1.0
info:
  title: TurtleTalk API
  version: 1.0.0
  description: |
    The contract of the TurtleTalk backend. The code must match this file.
    New needs are added here first, together with a decision record in docs/decisions/.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8000
    description: Local backend
security:
  - bearerAuth: []
tags:
  - name: sentences
    description: Sentences and translations imported from Tatoeba
  - name: mnemonics
    description: The learner's own picture cards
  - name: agents
    description: AI agents and their usage
paths:
  /sentences:
    get:
      operationId: listSentences
      tags: [sentences]
      summary: Browse and search sentences
      description: |
        Sentences imported from Tatoeba, ordered by id. Filter by language, by the language of the
        translations, and by a whole word in the text. Paging uses `limit` and `offset`; `total` is the number of matches
        before paging, so the client can show "page 2 of 7".
      security: []
      parameters:
        - name: lang
          in: query
          description: Language of the sentence (ISO 639-3).
          schema:
            $ref: "#/components/schemas/LangCode"
          example: spa
        - name: translation_lang
          in: query
          description: Only sentences that have a translation in this language; only those translations are returned.
          schema:
            $ref: "#/components/schemas/LangCode"
          example: eng
        - name: q
          in: query
          description: A whole word the sentence must contain (case-insensitive).
          schema:
            type: string
            minLength: 2
            maxLength: 100
          example: casa
        - name: limit
          in: query
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          description: How many matches to skip.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: One page of matching sentences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SentencePage"
              example:
                items:
                  - id: 14132239
                    lang: spa
                    text: Tom debería estar ahora en su oficina.
                    license: CC BY 2.0 FR
                    owner: null
                    translations:
                      - id: 14132240
                        lang: eng
                        text: Tom is supposed to be in his office now.
                        is_direct: true
                total: 3
                limit: 20
                offset: 0
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /sentences/{sentence_id}:
    get:
      operationId: getSentence
      tags: [sentences]
      summary: One sentence with all its translations
      security: []
      parameters:
        - name: sentence_id
          in: path
          required: true
          description: Tatoeba id of the sentence.
          schema:
            type: integer
          example: 14132239
      responses:
        "200":
          description: The sentence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sentence"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /mnemonics:
    get:
      operationId: listMnemonics
      tags: [mnemonics]
      summary: The learner's picture cards for one language pair
      parameters:
        - name: learning
          in: query
          schema:
            $ref: "#/components/schemas/LangCode"
            default: eng
        - name: native
          in: query
          schema:
            $ref: "#/components/schemas/LangCode"
            default: spa
      responses:
        "200":
          description: All picture cards of the learner and how many pictures are left
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MnemonicList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    post:
      operationId: saveMnemonic
      tags: [mnemonics]
      summary: Write a sentence for a word and get a picture card
      description: |
        Saves the learner's own sentence for a word and draws a picture for it.
        There is one card per learner, word and language pair: saving again replaces the sentence and
        the picture, so the answer is `200` both times (see docs/decisions/0004-sentences-and-picture-cards-in-the-contract.md).
        Each picture counts towards a limit of `daily_limit` pictures per 24 hours.
        If no picture can be made, the card is still saved and `image_url` is `null`; the UI shows the emoji.

        **Idempotency.** Send a new random `Idempotency-Key` (for example a UUID) with every save the learner
        means to do, and send the same key again when you retry it (timeout, lost connection, double click).
        The first request with a key does the work. A repeat with the same key and the same body returns the
        same card with `Idempotent-Replayed: true`: no new picture is drawn and the daily limit is not used.
        The same key with a different body is `409`. Keys belong to one learner and are kept for 24 hours.
        Failed requests (4xx/5xx) are not remembered, so they can be retried with the same key.
        See docs/decisions/0005-idempotent-picture-card-saves.md.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: A key that identifies one intended save. Use a new UUID for every new save.
          schema:
            type: string
            minLength: 8
            maxLength: 100
            pattern: "^[A-Za-z0-9_-]+$"
          example: 5f0c2a8e-3b1d-4c7e-9a64-2d8f1b7e9c11
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MnemonicInput"
            example:
              concept_id: 12
              learning: eng
              native: spa
              sentence: The woman reads a book.
      responses:
        "200":
          description: The saved card (new, or replayed for a repeated `Idempotency-Key`)
          headers:
            Idempotent-Replayed:
              description: Only sent when the request had an `Idempotency-Key`. `true` when this is the saved answer of an earlier request.
              schema:
                type: string
                enum: ["true", "false"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mnemonic"
        "400":
          description: The sentence breaks a rule, for example it does not use the word.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: Use the word “woman” in your sentence.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The `Idempotency-Key` was already used for a different request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: This Idempotency-Key was already used for a different request. Use a new key.
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /agents/usage:
    get:
      operationId: getMyAiUsageToday
      tags: [agents]
      summary: The current learner's AI answers today
      description: |
        How many AI answers the logged-in learner used today and how many are left.
        `is_admin` tells the UI whether to show the link to the Staff room.
      responses:
        "200":
          description: Today's usage of the current learner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiUsageToday"
              example:
                daily_limit: 30
                used_today: 15
                remaining_today: 15
                by_agent:
                  grammar: 5
                  conversation: 10
                is_admin: true
        "401":
          $ref: "#/components/responses/Unauthorized"
  /agents/usage/summary:
    get:
      operationId: getAiUsageSummary
      tags: [agents]
      summary: AI usage of every agent for the whole app
      description: |
        Totals per agent for the last `days` days, for all learners together.
        Only counts are returned, never what a learner wrote. Admins only.
        All five agents are always listed, also when they had no calls.
      parameters:
        - name: days
          in: query
          required: false
          description: How many days back to count, including today.
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 7
      responses:
        "200":
          description: Usage per agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiUsageSummary"
              example:
                days: 7
                generated_at: "2026-11-26T09:30:00Z"
                agents:
                  - agent: grammar
                    calls: 12
                    failures: 1
                    failure_rate: 0.083
                    tokens: 4100
                    learners: 2
                    models: ["openrouter/free"]
                    last_call_at: "2026-11-26T09:12:00Z"
                    daily:
                      - day: "2026-11-26"
                        calls: 5
                        failures: 0
                        tokens: 1800
                  - agent: cultural
                    calls: 0
                    failures: 0
                    failure_rate: 0
                    tokens: 0
                    learners: 0
                    models: []
                    last_call_at: null
                    daily: []
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /agents/live:
    get:
      operationId: getAgentsLive
      tags: [agents]
      summary: What every agent is doing right now
      description: |
        Live state of each agent, measured by the running server (see docs/decisions/0003-live-agent-states.md),
        today's counts, and the newest finished calls. Admins only. All five agents are always listed.
      responses:
        "200":
          description: Live state per agent and the newest calls
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentsLive"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase access token of the logged-in user.
  responses:
    Unauthorized:
      description: No token, or the token is not valid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            detail: No token provided.
    Forbidden:
      description: Logged in, but not allowed to see this.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            detail: Only admins can see AI usage for the whole app.
    ValidationFailed:
      description: A parameter or the body does not match this contract.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
    BadRequest:
      description: The request is well formed but breaks a rule of the app.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            detail: Native and learning language must be different.
    NotFound:
      description: The thing does not exist (or is not yours).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            detail: Sentence 1 not found
    TooManyRequests:
      description: A daily limit is used up.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            detail: You can create 5 pictures a day. Come back tomorrow!
  schemas:
    LangCode:
      type: string
      pattern: "^[a-z]{3,4}$"
      description: ISO 639-3 language code, for example `spa`, `eng`, `rus`, `cat`.
    Translation:
      type: object
      required: [id, lang, text, is_direct]
      properties:
        id:
          type: integer
        lang:
          $ref: "#/components/schemas/LangCode"
        text:
          type: string
        is_direct:
          type: boolean
          description: false when Tatoeba links the translation through another sentence.
    Sentence:
      type: object
      required: [id, lang, text, license, owner, translations]
      properties:
        id:
          type: integer
        lang:
          $ref: "#/components/schemas/LangCode"
        text:
          type: string
        license:
          type: [string, "null"]
          description: Licence of the sentence, `null` when Tatoeba gives none.
        owner:
          type: [string, "null"]
          description: Tatoeba user who added it, `null` when unknown.
        translations:
          type: array
          items:
            $ref: "#/components/schemas/Translation"
    SentencePage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Sentence"
        total:
          type: integer
          minimum: 0
          description: Matches before paging.
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
    MnemonicInput:
      type: object
      required: [concept_id, learning, native, sentence]
      properties:
        concept_id:
          type: integer
          minimum: 1
        learning:
          $ref: "#/components/schemas/LangCode"
        native:
          $ref: "#/components/schemas/LangCode"
        sentence:
          type: string
          minLength: 1
          maxLength: 500
          description: |
            Must use the word. After trimming it must be 3–200 characters; otherwise the answer is `400`
            with a sentence that explains the rule.
    Mnemonic:
      type: object
      required: [id, concept_id, slug, word, translation, emoji, sentence, masked_sentence, image_url, created_at]
      properties:
        id:
          type: integer
        concept_id:
          type: integer
        slug:
          type: string
        word:
          type: string
          description: The word in the learning language.
        translation:
          type: string
          description: The word in the native language.
        emoji:
          type: [string, "null"]
          description: Shown when there is no picture; `null` for words without an emoji.
        sentence:
          type: string
        masked_sentence:
          type: string
          description: The sentence with the word replaced by `___`, for flashcards.
        image_url:
          type: [string, "null"]
          format: uri
          description: Signed link to the picture, valid for one hour; `null` when there is no picture.
        created_at:
          type: string
          format: date-time
    MnemonicList:
      type: object
      required: [mnemonics, daily_limit, remaining_today, pictures_enabled]
      properties:
        mnemonics:
          type: array
          items:
            $ref: "#/components/schemas/Mnemonic"
        daily_limit:
          type: integer
          minimum: 0
        remaining_today:
          type: integer
          minimum: 0
        pictures_enabled:
          type: boolean
          description: false when the server has no image model or storage configured.
    Error:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          description: A sentence a person can read.
    ValidationError:
      type: object
      required: [detail]
      properties:
        detail:
          type: array
          items:
            type: object
            required: [loc, msg, type]
            properties:
              loc:
                type: array
                description: Where the problem is, for example ["query", "days"].
                items:
                  oneOf:
                    - type: string
                    - type: integer
              msg:
                type: string
              type:
                type: string
    AiUsageToday:
      type: object
      required: [daily_limit, used_today, remaining_today, by_agent, is_admin]
      properties:
        daily_limit:
          type: integer
          minimum: 0
        used_today:
          type: integer
          minimum: 0
        remaining_today:
          type: integer
          minimum: 0
        by_agent:
          type: object
          description: Calls today per agent. Agents without calls are left out.
          additionalProperties:
            type: integer
            minimum: 0
        is_admin:
          type: boolean
          description: True when this learner can open the Staff room.
    AgentName:
      type: string
      enum: [grammar, vocabulary, conversation, pronunciation, cultural]
    AiUsageSummary:
      type: object
      required: [days, generated_at, agents]
      properties:
        days:
          type: integer
          minimum: 1
          maximum: 90
        generated_at:
          type: string
          format: date-time
        agents:
          type: array
          description: Always the five agents, in a fixed order.
          items:
            $ref: "#/components/schemas/AgentUsage"
    AgentUsage:
      type: object
      required: [agent, calls, failures, failure_rate, tokens, learners, models, last_call_at, daily]
      properties:
        agent:
          $ref: "#/components/schemas/AgentName"
        calls:
          type: integer
          minimum: 0
        failures:
          type: integer
          minimum: 0
        failure_rate:
          type: number
          minimum: 0
          maximum: 1
          description: failures divided by calls, 0 when there were no calls.
        tokens:
          type: integer
          minimum: 0
        learners:
          type: integer
          minimum: 0
          description: Different learners who used this agent in the period.
        models:
          type: array
          description: Models that answered, most used first.
          items:
            type: string
        last_call_at:
          type: [string, "null"]
          format: date-time
          description: Time of the newest call, null when the agent had no calls.
        daily:
          type: array
          description: One item per day that had calls, oldest first. Days without calls are left out.
          items:
            $ref: "#/components/schemas/AgentDay"
    AgentDay:
      type: object
      required: [day, calls, failures, tokens]
      properties:
        day:
          type: string
          format: date
        calls:
          type: integer
          minimum: 0
        failures:
          type: integer
          minimum: 0
        tokens:
          type: integer
          minimum: 0
    AgentState:
      type: string
      enum: [idle, waiting, thinking, working, success, error, blocked]
    AgentsLive:
      type: object
      required: [generated_at, tracking_since, agents, recent]
      properties:
        generated_at:
          type: string
          format: date-time
        tracking_since:
          type: string
          format: date-time
          description: When this server process started tracking live states.
        agents:
          type: array
          description: Always the five agents, in a fixed order.
          items:
            $ref: "#/components/schemas/AgentLive"
        recent:
          type: array
          description: Newest finished calls of the last 7 days, newest first, at most 30.
          items:
            $ref: "#/components/schemas/AgentEvent"
    AgentLive:
      type: object
      required: [agent, state, detail, queued, running, running_ms, average_ms, last_finished_at, last_succeeded,
        calls_today, failures_today, last_call_at]
      properties:
        agent:
          $ref: "#/components/schemas/AgentName"
        state:
          $ref: "#/components/schemas/AgentState"
        detail:
          type: string
          description: A short sentence about the state, for example why the agent is blocked.
        queued:
          type: integer
          minimum: 0
        running:
          type: integer
          minimum: 0
        running_ms:
          type: [integer, "null"]
          description: How long the oldest running call has been going.
        average_ms:
          type: [integer, "null"]
          description: Average time of successful calls since the server started.
        last_finished_at:
          type: [string, "null"]
          format: date-time
        last_succeeded:
          type: [boolean, "null"]
        calls_today:
          type: integer
          minimum: 0
        failures_today:
          type: integer
          minimum: 0
        last_call_at:
          type: [string, "null"]
          format: date-time
    AgentEvent:
      type: object
      required: [id, agent, model, succeeded, tokens, created_at]
      properties:
        id:
          type: integer
        agent:
          $ref: "#/components/schemas/AgentName"
        model:
          type: string
        succeeded:
          type: boolean
        tokens:
          type: [integer, "null"]
        created_at:
          type: string
          format: date-time
